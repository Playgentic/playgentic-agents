name: Release

# Triggered by the tag the /release skill pushes. Re-checks everything, builds one
# zip per harness, and publishes the GitHub release with them attached.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Tag matches manifest version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node scripts/release.mjs current)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match manifest version $manifest"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Build plugin zips
        run: node scripts/release.mjs package "${{ steps.version.outputs.version }}"

      - name: Release notes
        run: node scripts/release.mjs notes "${{ steps.version.outputs.version }}" > dist/NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "v$v" dist/*.zip \
            --title "v$v" \
            --notes-file dist/NOTES.md \
            --verify-tag
